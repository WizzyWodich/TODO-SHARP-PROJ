<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Auth</title>

    <link rel="stylesheet" href="../styles/auth.css" />
  </head>

  <body>
    <main>
      <div class="auth">
        <div id="loginForm">
          <h2>Вход</h2>

          <input id="loginName" type="text" placeholder="Логин" />

          <input id="loginPassword" type="password" placeholder="Пароль" />

          <button id="loginBtn" type="button">Войти</button>

          <p>
            Нет аккаунта?
            <a href="#" id="showRegister"> Регистрация </a>
          </p>
        </div>

        <!-- REGISTER -->
        <div id="registerForm" class="hidden">
          <h2>Регистрация</h2>

          <input id="registerName" type="text" placeholder="Логин" />

          <input id="registerPassword" type="password" placeholder="Пароль" />

          <button id="registerBtn" type="button">Создать аккаунт</button>

          <p>
            Уже есть аккаунт?
            <a href="#" id="showLogin"> Войти </a>
          </p>
        </div>
      </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
